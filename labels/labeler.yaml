workflows:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

source:
  - changed-files:
      - any-glob-to-any-file:
          - "app/**"
          - "src/**"
          - "dist/**"
          - "Dockerfile"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "README.md"
          - "CONTRIBUTING.md"
