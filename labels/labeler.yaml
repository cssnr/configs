workflows:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

source:
  - changed-files:
      - any-glob-to-any-file:
          - "app/**"
          - "cmd/**"
          - "dist/**"
          - "scripts/**"
          - "src/**"
          - "*.iss"
          - "*.pkgproj"
          - "go.mod"
          - "go.sum"
          - "main.go"
          - "main.py"
          - "Dockerfile"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "CONTRIBUTING.md"
          - "README.md"
          - "TODO.md"
